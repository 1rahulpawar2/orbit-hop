name: Build app for Google Play

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add the 4 secrets from SECRETS.txt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Warn if still using test ads
        run: |
          if grep -q "ca-app-pub-3940256099942544" gradle.properties; then
            echo "::warning::gradle.properties still has Google's TEST ad IDs. The app works but earns nothing until you paste your real AdMob IDs."
          fi

      - name: Build signed app bundle (.aab) and test APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Upload .aab (this is the file for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: upload-this-to-google-play-v${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload .apk (test version with test ads, safe to tap on your own phone)
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
